# Profil DEV : base H2 en mémoire, schéma recréé au démarrage, logs verbeux.
spring:
  datasource:
    url: jdbc:h2:mem:vehicledb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  h2:
    console:
      enabled: true

logging:
  level:
    fr.locadrive: DEBUG
