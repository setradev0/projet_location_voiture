# Profil DEV : services en local, CORS ouvert au front Angular de développement.
spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:4200
                allowed-methods: '*'
                allowed-headers: '*'
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: vehicle-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/vehicles/**
            - id: booking-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/bookings/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
